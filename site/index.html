<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #111318;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 48px 36px;
      text-align: center;
      background: #1b1e24;
      border: 1px solid #30343c;
      border-radius: 16px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 28px;
      border: 3px solid #353942;
      border-top-color: #f5f5f5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .message {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }

    .description {
      font-size: 14px;
      color: #999da6;
      line-height: 1.7;
    }

    .progress {
      width: 100%;
      height: 3px;
      margin: 32px 0 24px;
      background: #353942;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #e5e7eb;
      animation: loading 1s linear forwards;
    }

    a {
      font-size: 13px;
      color: #b4b8c0;
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes loading {
      to {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner,
      .progress-bar {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="spinner" aria-hidden="true"></div>

    <p class="message">Redirecting...</p>

    <p class="description">
      We are moving to a new domain, so please wait while we take you there...
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <a id="redirect-link" href="https://somewhere.censun.org">
      Click here if you are not redirected
    </a>
  </main>

  <script>
    const target = new URL("https://somewhere.censun.org");

    // Preserve the current query parameters and hash fragment.
    target.search = window.location.search;
    target.hash = window.location.hash;

    // Make the manual fallback link point to the same destination.
    document.getElementById("redirect-link").href = target.href;

    // Give the loading animation one second before redirecting.
    setTimeout(() => {
      window.location.replace(target.href);
    }, 1000);
  </script>
</body>
</html>
